services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-movescout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-movescout}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movescout}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-movescout}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-movescout}
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build:
      context: ../mcp
      dockerfile: Dockerfile
    ports:
      - "${MCP_HOST_PORT:-8788}:8080"
    environment:
      MIDDLEWARE_URL: http://api:8000
      MIDDLEWARE_API_KEY: ${MCP_API_KEY:-}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
      MCP_HTTP_PORT: 8080
      MCP_HTTP_TOKEN: ${MCP_HTTP_TOKEN:-}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
