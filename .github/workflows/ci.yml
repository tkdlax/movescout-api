name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests scripts

      - name: Test
        run: pytest
        env:
          ENCRYPTION_KEY: "J6i1QSGGygoqohrF5JcJy0-ofefh8okZ3hJNsHQP02U="

      - name: Build Docker image
        run: docker build -t movescout-api:ci .
